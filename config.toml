title = "Hi, I'm Muhammad Nurfaisal"
baseURL = 'https://muhnurfaisal.my.id'

# This is what goes in <html lang="">
languageCode = 'en-us'

theme = "hugo-blog-awesome"

# This defines how dates are formatted
defaultContentLanguage = "en-us"

# GA4 sekarang dihandle lewat Google Tag Manager (lihat layouts/partials/head.html),
# jadi baris ini sengaja dikosongin biar nggak dobel tracking.
# To enable Google Analytics 4 (gtag.js) provide G-MEASUREMENT_ID below.
# To disable Google Analytics, simply leave the field empty or remove the next line
# googleAnalytics = 'G-P118LBHZQK' # G-MEASUREMENT_ID

# Enable emojis globally
enableEmoji = true
ignoreErrors = ["additional-script-loading-error"] # ignore error of loading additional scripts.

# To enable Disqus comments, provide Disqus Shortname below.
# To disable Disqus comments, simply leave the field empty or remove the next line
#disqusShortname = ''

# set markup.highlight.noClasses=false to enable code highlight
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
	[markup.tableOfContents]
		startLevel = 2 # ToC starts from H2
		endLevel = 4 # ToC ends at H4
		ordered = false # generates <ul> instead of <ol>

[menu]
  # pageRef dipakai untuk highlight menu aktif; `url` jadi fallback kalau page nggak ketemu.
  [[menu.main]]
    pageRef="about"
    name = 'About'
    url = '/about/'
    weight = 10
  [[menu.main]]
    pageRef="posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20


[params]
  sitename = "Nurfaisal"
  defaultColor = "dark" # set color mode: dark, light, auto
  # Setting it to 'auto' applies the color scheme based on the visitor's device color preference.If you don't specify anything, ignore this parameter, or leave it blank,
  # the default value is set to 'auto'.
  # You can take a look at layouts/index.html for more information.
  homeTitle = "Muhammad Nurfaisal | Infrastructure & System Engineer" # <title> khusus homepage
  description = "Personal blog & portfolio of Muhammad Nurfaisal — Infrastructure & System Engineer from Bogor, Indonesia."
  #mainSections = ['posts']
  toc = false # set to false to disable table of contents 'globally'
  goToTop = true # set to false to disable 'go to top' button
  ogimage = "/images/og-default.png" # default image used for link previews (WhatsApp, Twitter, etc) when a post doesn't set its own `image` param
  # additionalScripts = ['js/custom.js', 'js/custom-2.js']
  # Will try to load 'assets/js/custom.js' and 'assets/js/custom-2.js'.
  # Your custom scripts will be concatinated to one file `custom.js`.
  # When building for production it will be minified.
  # The file `custom.js` is loaded on each page (before body tag ends).

[params.author]
  avatar = "avatar-min.png" # put the file in assets folder; also ensure that image has same height and width
  # Note: image is not rendered if the resource(avatar image) is not found. No error is displayed.
  intro = "Muhammad Nurfaisal"
  name = "Muhammad Nurfaisal"
  description = "An Infrastructure & System Engineer from Bogor, Indonesia."

# Allow to override webmanifest options
[params.webmanifest]
  name = "Nurfaisal" # will use "params.sitename" or "title" by default
  short_name = "Nurfaisal" # same as name
  start_url = "/" # will use homepage url by default
  theme_color = "#0B0F0E" # sama dengan $portfolio-bg; juga override <meta name="theme-color">
  background_color = "auto" # by default depend on "params.defaultColor" for "light" or "auto" will be set to "#fff" for dark will be "#131418" (color of dark mode background)
  display = "standalone"

# Allow to override `browserconfig.xml` params (configuration for windows embeded browsers)
[params.browserconfig]
  TileColor = "#0B0F0E" # warna tile Windows, samakan dengan background

[[params.socialIcons]]
name = "github"
url = "https://github.com/paisaal"
